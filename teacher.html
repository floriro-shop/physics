input,select,textarea,button{font-family:"LatinDigits","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif}

:root{--bg:#f1f5f9;--ink:#10243e;--mute:#566a82;--acc:#0b7d93;--ok:#1b8a4b;--bad:#c0392b;--warn:#b86a0c;--card:#fff;--line:#d3dce6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1724;--ink:#e8eff7;--mute:#9db0c6;--acc:#4fd1de;--ok:#4cc27f;--bad:#ff7b6b;--warn:#f0a94a;--card:#122338;--line:#27425e}}
:root[data-theme="dark"]{--bg:#0b1724;--ink:#e8eff7;--mute:#9db0c6;--acc:#4fd1de;--ok:#4cc27f;--bad:#ff7b6b;--warn:#f0a94a;--card:#122338;--line:#27425e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"LatinDigits","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;line-height:1.7}
main{max-width:900px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:6px 0 2px}
h3{margin:0 0 6px}
.sub{color:var(--mute);margin:0 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.b{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:600}
.b:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.b[aria-pressed="true"]{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.b.p[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.b.a[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.b.l[aria-pressed="true"]{background:var(--warn);border-color:var(--warn)}
.b.main{background:var(--acc);color:var(--bg);border-color:var(--acc)}
.b.del{color:var(--bad);padding:2px 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin:8px 0}
label{display:block;color:var(--mute)}
input,select,textarea{font:inherit;width:100%;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:4px}
.row input{width:auto;flex:1 1 110px}
.row label{flex:1 1 110px}
.r{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line)}
.r0{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sc{font-weight:700;color:var(--ok);direction:ltr;unicode-bidi:isolate}
.sc.low{color:var(--bad)}
.grp{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;padding:0 10px;border-radius:999px;color:var(--bg);font-size:.8rem}
.tag.pos{background:var(--ok)}.tag.neg{background:var(--bad)}
small,.note{color:var(--mute)}
.sum{font-weight:700;color:var(--acc)}
.code{font-family:Consolas,monospace;direction:ltr;unicode-bidi:isolate;letter-spacing:1px}
.wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:520px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:center}
th:first-child,td:first-child{text-align:start}
#msg{min-height:1.5em;color:var(--bad)}
ol{margin:6px 0;padding-inline-start:1.3em}
.b.e[aria-pressed="true"]{background:var(--mute);border-color:var(--mute)}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:8px 0}
.cat{font:inherit;cursor:pointer;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 12px;text-align:start}
.cat:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.cat b{display:block}
.cat span{font-weight:700;direction:ltr;unicode-bidi:isolate;display:inline-block}
.cat.pos span{color:var(--ok)}.cat.neg span{color:var(--bad)}
.bh{margin:12px 0 0;font-size:1rem;color:var(--acc)}
.cat:active{transform:scale(.97)}

/* ===== تصميم أفق ===== */
:root{--navy:#0c1c30;--navy2:#13304d;--horizon:#f2a33a;--acc:#0f6e86;--bg:#eef2f6;--ink:#0f2238;--line:#dbe3ec;--shadow:0 1px 0 rgba(15,40,70,.05),0 10px 26px -14px rgba(15,40,70,.28)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#08121e;--card:#0f2036;--line:#1f3752;--acc:#3fc3d6;--shadow:0 1px 0 rgba(0,0,0,.3),0 10px 26px -14px rgba(0,0,0,.6)}}
body{background:var(--bg)}
.top{background:linear-gradient(180deg,var(--navy),var(--navy2));color:#eaf2fa;position:relative;padding:max(14px,env(safe-area-inset-top)) 0 16px}
.top::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,#0f6e86,var(--horizon) 45%,#0f6e86)}
.top-in{max-width:900px;margin:0 auto;padding:0 16px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h1{font-size:1.8rem;font-weight:700;margin:0;line-height:1.3;color:#fff}
.top .sub{color:#9db6cf;margin:0;font-size:.85rem}
#secs{margin:0;gap:0;background:rgba(255,255,255,.09);border-radius:14px;padding:4px;display:grid;grid-template-columns:repeat(3,1fr)}
#secs .b{background:transparent;color:#cfe0f0;border:0;border-radius:11px;padding:8px 0;text-align:center;font-weight:600;transition:background .15s,color .15s}
#secs .b[aria-pressed="true"]{background:#fff;color:var(--navy);box-shadow:0 2px 8px rgba(0,0,0,.25)}
.strip{position:sticky;top:0;z-index:50;display:flex;align-items:stretch;background:var(--card);border-bottom:1px solid var(--line);box-shadow:0 6px 16px -12px rgba(15,40,70,.4)}
#tabs{margin:0;flex:1;flex-wrap:nowrap;overflow-x:auto;gap:2px;padding:0 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
#tabs::-webkit-scrollbar{display:none}
#tabs .b{flex:none;background:transparent;color:var(--mute);border:0;border-radius:0;border-bottom:3px solid transparent;padding:12px 14px 9px;white-space:nowrap;font-weight:600}
#tabs .b[aria-pressed="true"]{background:transparent;color:var(--ink);border-bottom-color:var(--horizon)}
.lgout{flex:none;margin:7px 8px;background:#d93025;color:#fff;border:0;border-radius:10px;padding:0 12px;font:600 .8rem inherit;font-family:inherit;cursor:pointer;white-space:nowrap}
.lgout:hover{background:#b9261c}.lgout:focus-visible{outline:3px solid var(--horizon);outline-offset:2px}
main{padding-top:14px;padding-bottom:40px}
.card{border:0;border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.card h3{font-size:1.05rem;margin:0 0 8px;color:var(--ink)}
.b{padding:8px 16px;min-height:40px;transition:background .15s,border-color .15s,transform .1s}
.b:active{transform:scale(.97)}
.b.main{background:var(--acc);color:#fff;border-color:var(--acc);box-shadow:0 6px 14px -8px var(--acc)}
.b[aria-pressed="true"]{color:#fff}
.b.del{min-height:0}
input,select,textarea{border-radius:12px;background:var(--card);border:1px solid var(--line);padding:9px 12px}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
.r{padding:10px 4px}
.cat{border-radius:14px;box-shadow:var(--shadow);border:0}
.cats{gap:10px}
table{border-radius:12px;overflow:hidden}
th{background:rgba(15,110,134,.08);color:var(--ink);font-weight:700}
tbody tr:nth-child(even) td{background:rgba(15,40,70,.025)}
.bh{font-weight:700}
#msg:empty,#secs:empty,.strip:not(:has(button)){display:none}#msg{margin:0 0 8px}
.lgout{padding:0 10px;font-size:.75rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.top h1 small{display:block;font-size:.95rem;font-weight:500;color:#9db6cf;margin-top:2px}
.wel{position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(6,14,24,.62);backdrop-filter:blur(3px);animation:welIn .25s ease-out}
.wel-c{width:100%;max-width:380px;background:var(--card);color:var(--ink);border-radius:22px;overflow:hidden;box-shadow:0 30px 70px -20px rgba(0,0,0,.6)}
.wel-h{background:linear-gradient(180deg,var(--navy),var(--navy2));padding:22px 20px 18px;color:#fff;position:relative}
.wel-h::after{content:"";position:absolute;inset-inline:0;bottom:0;height:3px;background:linear-gradient(90deg,#0f6e86,var(--horizon) 45%,#0f6e86)}
.wel-h svg{display:block;margin-bottom:8px}
.wel-h h2{margin:0;font-size:1.35rem;line-height:1.4}
.wel-h p{margin:2px 0 0;color:#9db6cf;font-size:.9rem}
.wel-b{padding:16px 20px 20px}
.wel-b ul{list-style:none;margin:0 0 16px;padding:0}
.wel-b li{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.wel-b li:last-child{border-bottom:0}
.wel-b li b{color:var(--acc)}
.wel-b li b.warn{color:var(--warn)}
.wel-b .b.main{width:100%;min-height:46px;font-size:1rem}
@keyframes welIn{from{opacity:0}to{opacity:1}}
