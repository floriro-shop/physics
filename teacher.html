syncAll:async function(show){var ids=Object.keys(ST),n=0;for(var id of ids){try{await enqueue(function(){return pushStudent(id)});n++}catch(e){say('تعذّرت المزامنة عند الطالب '+(n+1)+'.');return}if(show&&n%5===0)say('جارٍ المزامنة '+n+' / '+ids.length+'...',true)}emit();if(show)say('تمت مزامنة '+n+' طالب مع الموقع.',true)},
imp:async function(file){try{var j=JSON.parse(await file.text());if(!j||typeof j.students!=='object'){say('الملف غير صالح.');return}
var ids=Object.keys(j.students);ids.forEach(function(id){var o=j.students[id];delete o.id;ST[id]=o});if(j.cfg){CFG=j.cfg;await post([{o:'cset',d:CFG}]);emitCfg()}emit();say('جارٍ رفع '+ids.length+' طالب...',true);
var n=0;for(var id of ids){await enqueue(function(){return pushStudent(id)});n++;if(n%5===0)say('جارٍ الرفع '+n+' / '+ids.length+'...',true)}say('تم استيراد '+n+' طالب ونشر تقاريرهم.',true)}catch(e){say('تعذّر استيراد الملف.')}}};
head();build();
var synced=false;
function sig(g){return (g||[]).filter(function(x){return x.pr}).map(function(x){return [x.pr,x.b,x.s,x.x,x.w,x.u||0,x.uo||0].join('|')}).sort().join(';')}
function resync(){if(synced||!S.st.length)return;synced=true;setTimeout(async function(){var cf=CF();for(var s of S.st){if(sig(buildGR(s.rec,cf,s.att))!==sig(s.gr)){if(!await saveRec(s,s.rec,cf))break}}},900)}
cfgc.onSnapshot(function(sn){sn.docs.forEach(function(x){if(x.id==='main')S.cfg=x.data()});if(S.tab==='set')fill()},function(){});
col.onSnapshot(function(sn){S.st=sn.docs.map(function(x){var o=Object.assign({},x.data());o.id=x.id;return o});fill();resync()},function(){say('تعذّر قراءة البيانات.')});
setInterval(function(){if(document.visibilityState==='visible')q.then(reload)},45000);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')q.then(reload)});
setTimeout(function(){var miss=Object.keys(ST).filter(function(id){return !ST[id].rid&&ST[id].code});if(miss.length){say('جارٍ نشر تقارير الطلاب...',true);window.OFQ.syncAll(false).then(function(){say('تم نشر التقارير.',true)})}},2500);
}catch(e){$('view').innerHTML='<p class="note">تعذّر تحميل اللوحة.</p>'}

})();
})();
</script>
</body>
</html>
